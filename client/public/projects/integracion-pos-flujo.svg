<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, system-ui, sans-serif">
  <style>
    .t { fill: #e2e8f0; }
    .m { fill: #94a3b8; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 2; }
    .wire { stroke: #475569; stroke-width: 3; stroke-dasharray: 8 8; fill: none; }
    .flow { animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .ok { opacity: 0; animation: ok 6s infinite; }
    @keyframes ok { 0%, 70% { opacity: 0; } 75%, 95% { opacity: 1; } 100% { opacity: 0; } }
    .screenAmt { opacity: 0; animation: amt 6s infinite; }
    @keyframes amt { 0%, 40% { opacity: 0; } 45%, 95% { opacity: 1; } 100% { opacity: 0; } }
    .pulse { animation: pulse 6s infinite; transform-origin: 400px 250px; }
    @keyframes pulse { 0%, 20% { stroke: #334155; } 25%, 40% { stroke: #818cf8; } 45%, 100% { stroke: #334155; } }
  </style>
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="50" text-anchor="middle" class="t" font-size="22" font-weight="700">Integración Máquinas POS</text>
  <text x="400" y="76" text-anchor="middle" class="m" font-size="14">La caja envía el monto y la máquina de pago cobra sola</text>

  <!-- Caja -->
  <rect x="40" y="140" width="200" height="220" rx="14" class="box"/>
  <text x="140" y="172" text-anchor="middle" class="t" font-size="15" font-weight="600">Caja (sistema web)</text>
  <rect x="62" y="190" width="156" height="70" rx="8" fill="#0f172a"/>
  <text x="140" y="218" text-anchor="middle" class="m" font-size="12">TOTAL</text>
  <text x="140" y="246" text-anchor="middle" fill="#a5b4fc" font-size="24" font-weight="700">$12.990</text>
  <rect x="62" y="280" width="156" height="40" rx="8" fill="#4f46e5"/>
  <text x="140" y="306" text-anchor="middle" fill="#fff" font-size="15" font-weight="600">Cobrar</text>

  <!-- API -->
  <rect x="300" y="140" width="200" height="220" rx="14" class="box pulse"/>
  <text x="400" y="172" text-anchor="middle" class="t" font-size="15" font-weight="600">API local</text>
  <text x="400" y="192" text-anchor="middle" class="m" font-size="12">Python · Flask</text>
  <rect x="322" y="212" width="156" height="30" rx="6" fill="#0f172a"/>
  <text x="400" y="232" text-anchor="middle" fill="#86efac" font-size="13" font-family="Consolas, monospace">POST /pago</text>
  <rect x="322" y="252" width="156" height="30" rx="6" fill="#0f172a"/>
  <text x="400" y="272" text-anchor="middle" class="m" font-size="12">Registro en SQLite</text>
  <rect x="322" y="292" width="156" height="30" rx="6" fill="#0f172a"/>
  <text x="400" y="312" text-anchor="middle" class="m" font-size="12">Evita cobros dobles</text>

  <!-- Maquina -->
  <rect x="580" y="120" width="180" height="260" rx="22" class="box"/>
  <rect x="604" y="146" width="132" height="90" rx="8" fill="#0f172a"/>
  <text x="670" y="176" text-anchor="middle" class="m" font-size="12">Máquina de pago</text>
  <g class="screenAmt"><text x="670" y="212" text-anchor="middle" fill="#a5b4fc" font-size="22" font-weight="700">$12.990</text></g>
  <g fill="#334155">
    <rect x="610" y="252" width="34" height="22" rx="4"/><rect x="653" y="252" width="34" height="22" rx="4"/><rect x="696" y="252" width="34" height="22" rx="4"/>
    <rect x="610" y="282" width="34" height="22" rx="4"/><rect x="653" y="282" width="34" height="22" rx="4"/><rect x="696" y="282" width="34" height="22" rx="4"/>
  </g>
  <text x="670" y="334" text-anchor="middle" class="m" font-size="11">Transbank · Getnet</text>
  <text x="670" y="352" text-anchor="middle" class="m" font-size="11">Mercado Pago · TUU</text>

  <!-- cables -->
  <path d="M240 250 H300" class="wire flow"/>
  <path d="M500 250 H580" class="wire flow"/>

  <!-- paquete de ida -->
  <g>
    <rect x="-34" y="-13" width="68" height="26" rx="13" fill="#6366f1"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">$12.990</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;0.15;0.25;0.42;1" keyPoints="0;0;0.5;1;1" calcMode="linear" path="M240 250 H580"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.15;0.4;0.43;1"/>
  </g>
  <!-- respuesta -->
  <g>
    <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#16a34a"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">APROBADA</text>
    <animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;0.5;0.72;1" keyPoints="0;0;1;1" calcMode="linear" path="M580 290 H240"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.72;0.74;1"/>
  </g>
  <g class="ok">
    <circle cx="140" cy="410" r="18" fill="#16a34a"/>
    <path d="M131 410 l6 6 l12 -13" stroke="#fff" stroke-width="3" fill="none"/>
    <text x="166" y="415" class="t" font-size="14">Venta pagada sin digitar el monto</text>
  </g>
</svg>
