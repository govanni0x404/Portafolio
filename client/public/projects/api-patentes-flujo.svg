<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, system-ui, sans-serif">
  <style>
    .t { fill: #e2e8f0; }
    .m { fill: #94a3b8; }
    .box { fill: #1e293b; stroke: #334155; stroke-width: 2; }
    .wire { stroke: #475569; stroke-width: 3; stroke-dasharray: 8 8; fill: none; animation: dash 1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -16; } }
    .step1 { animation: s1 7s infinite; }
    .step2 { animation: s2 7s infinite; }
    .step3 { animation: s3 7s infinite; }
    @keyframes s1 { 0%, 28% { stroke: #818cf8; } 30%, 100% { stroke: #334155; } }
    @keyframes s2 { 0%, 30% { stroke: #334155; } 32%, 58% { stroke: #818cf8; } 60%, 100% { stroke: #334155; } }
    @keyframes s3 { 0%, 60% { stroke: #334155; } 62%, 96% { stroke: #818cf8; } 100% { stroke: #334155; } }
    .scan { animation: scan 1.4s ease-in-out infinite alternate; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(52px); } }
    .l1, .l2, .l3, .l4 { opacity: 0; }
    .l1 { animation: l1 7s infinite; } .l2 { animation: l2 7s infinite; } .l3 { animation: l3 7s infinite; } .l4 { animation: l4 7s infinite; }
    @keyframes l1 { 0%, 63% { opacity: 0; } 65%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l2 { 0%, 69% { opacity: 0; } 71%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l3 { 0%, 75% { opacity: 0; } 77%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l4 { 0%, 81% { opacity: 0; } 83%, 96% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="50" text-anchor="middle" class="t" font-size="22" font-weight="700">API Patentes</text>
  <text x="400" y="76" text-anchor="middle" class="m" font-size="14">De una patente (o su foto) a los datos del vehículo</text>

  <!-- 1. Patente / foto -->
  <rect x="30" y="130" width="210" height="240" rx="14" class="box step1"/>
  <text x="135" y="162" text-anchor="middle" class="t" font-size="15" font-weight="600">1. Patente o foto</text>
  <rect x="55" y="190" width="160" height="70" rx="8" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  <text x="135" y="208" text-anchor="middle" fill="#334155" font-size="10" font-weight="700">CHILE</text>
  <text x="135" y="246" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="800" letter-spacing="1">GH·JK·45</text>
  <text x="135" y="296" text-anchor="middle" fill="#86efac" font-size="12" font-family="Consolas, monospace">POST /ocr-patente</text>
  <text x="135" y="318" text-anchor="middle" fill="#86efac" font-size="12" font-family="Consolas, monospace">POST /buscar-patente</text>
  <text x="135" y="348" text-anchor="middle" class="m" font-size="11">OCR lee la patente de la foto</text>

  <!-- 2. Scraping -->
  <rect x="295" y="130" width="210" height="240" rx="14" class="box step2"/>
  <text x="400" y="162" text-anchor="middle" class="t" font-size="15" font-weight="600">2. Web scraping</text>
  <rect x="320" y="185" width="160" height="110" rx="8" fill="#0f172a"/>
  <circle cx="334" cy="197" r="4" fill="#f87171"/><circle cx="346" cy="197" r="4" fill="#fbbf24"/><circle cx="358" cy="197" r="4" fill="#4ade80"/>
  <g fill="#334155">
    <rect x="332" y="214" width="136" height="8" rx="4"/><rect x="332" y="232" width="100" height="8" rx="4"/>
    <rect x="332" y="250" width="120" height="8" rx="4"/><rect x="332" y="268" width="80" height="8" rx="4"/>
  </g>
  <rect x="326" y="210" width="148" height="16" rx="4" fill="#6366f1" opacity="0.35" class="scan"/>
  <text x="400" y="324" text-anchor="middle" class="m" font-size="12">Consulta sitios públicos</text>
  <text x="400" y="344" text-anchor="middle" class="m" font-size="12">y extrae los datos</text>

  <!-- 3. JSON -->
  <rect x="560" y="130" width="210" height="240" rx="14" class="box step3"/>
  <text x="665" y="162" text-anchor="middle" class="t" font-size="15" font-weight="600">3. Respuesta JSON</text>
  <rect x="574" y="182" width="182" height="168" rx="8" fill="#0f172a"/>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="584" y="206" class="m">{</text>
    <text x="596" y="232" class="l1"><tspan fill="#a5b4fc">"patente"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"GHJK45"</tspan></text>
    <text x="596" y="258" class="l2"><tspan fill="#a5b4fc">"marca"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"…"</tspan></text>
    <text x="596" y="284" class="l3"><tspan fill="#a5b4fc">"modelo"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"…"</tspan></text>
    <text x="596" y="310" class="l4"><tspan fill="#a5b4fc">"año"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fbbf24">2019</tspan></text>
    <text x="584" y="336" class="m">}</text>
  </g>

  <path d="M240 250 H295" class="wire"/>
  <path d="M505 250 H560" class="wire"/>
  <text x="400" y="430" text-anchor="middle" class="m" font-size="13">Python · FastAPI · OCR · Web Scraping</text>
</svg>
